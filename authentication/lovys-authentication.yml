notes: >-
  The Lovys Partner API is fronted by Azure API Management. Partner sign-up and
  authentication are handled through Microsoft Entra ID / Azure Active Directory
  B2C (see https://docs.lovys.com/signup-oauth), so access is OAuth2-based. The
  getting-started guide documents an Authentication section plus a "Reseller
  Identification" step, indicating a partner/reseller-scoped OAuth credential in
  addition to reseller identification headers. The published developer portal is
  an early-stage scaffold (placeholder bodies), so exact token URLs, flows, and
  scopes are not yet public; captured here from the documented surfaces only.
