name: Lovys
description: >-
  Lovys is a European digital neo-insurance provider offering flexible,
  subscription-based cover for home (habitation), smartphone, and pet insurance,
  designed to be managed entirely online and adjusted month to month. Beyond its
  direct-to-consumer product, Lovys operates a Partner API (the "Lovys Partner
  API") that lets resellers and platforms embed insurance into their own
  experiences: creating and managing real-time quotes, retrieving plans, pricing
  and coverage options, capturing and managing customer data, enabling policy
  purchase and activation, and handling the policy lifecycle, updates, and
  renewals. The Partner API is fronted by Azure API Management and authenticated
  with OAuth2 via Microsoft Entra ID / Azure Active Directory B2C. The public
  developer portal (docs.lovys.com) documents getting-started, onboarding,
  quoting, purchase, and end-to-end partner guides alongside an API reference
  covering account, customer, quote, basket, orders, payments, policies, and
  reference-data resources.
